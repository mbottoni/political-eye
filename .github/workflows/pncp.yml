name: pncp

# Reads yesterday's contracts (published and updated) from the PNCP, then the
# history back to September 2021, newest day first, for up to five hours; the
# next run continues. The API throttles hard (HTTP 429 past ~20 requests a
# minute), so requests are paced. Once the history is read, a run takes a few
# minutes. Commits only when a table changed.
on:
  schedule:
    - cron: "47 8 * * *"   # daily, 08:47 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "Time budget in hours"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: pncp
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q tests/pncp

      - name: Read contracts
        env:
          HOURS: ${{ inputs.hours || '5' }}
        run: |
          if [[ ! "$HOURS" =~ ^[0-9.]+$ ]]; then
            echo "hours must be a number, got: $HOURS" >&2
            exit 1
          fi
          uv run python -m politicaleye pncp update --hours "$HOURS"

      - name: Rebuild the explorer's summaries
        if: ${{ !cancelled() }}   # keep what was read even if the read failed
        run: uv run python -m politicaleye site build pncp

      - name: Log what changed
        if: ${{ !cancelled() }}
        # Contracts of R$ 100 million or more published in the last 90 days (data/site/mudancas/, docs/feeds/).
        run: uv run python -m politicaleye site changes pncp

      - name: Commit if a table changed
        if: ${{ !cancelled() }}
        run: |
          git add data/pncp data/site/pncp data/site/mudancas docs/feeds
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          # GitHub refuses a whole push if one file is over 100 MB: name it instead of losing the run to a vague error.
          big=$(git diff --staged --name-only --diff-filter=AM -z | xargs -0 -r du -m | awk '$1 >= 95 {print $2 " (" $1 " MB)"}')
          if [ -n "$big" ]; then
            echo "::error::files near GitHub's 100 MB limit, split them: $big"
            exit 1
          fi
          n=$(git diff --staged -U0 -- data/pncp/dias.csv | grep -c '^+[0-9]' || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "pncp: update through $(date -u +%F)" -m "Days read or updated: ${n}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs   # on a clash in a generated summary, this run's (newer) build wins
            # The feed of every source is built from every source's log: rebuild it from the logs as now merged,
            # so another job's changes pushed meanwhile are not dropped from it.
            uv run python -m politicaleye site feeds
            git add docs/feeds
            git diff --staged --quiet || git commit -m "pncp: feeds rebuilt with the changes other jobs pushed"
            # A long run uses the code it started with. If the page's builder changed on main
            # meanwhile, rebuild the summaries with the code now there, so they never go out stale.
            if ! git diff --quiet "$GITHUB_SHA" HEAD -- politicaleye; then
              uv run python -m politicaleye site build pncp
              uv run python -m politicaleye site changes pncp
              git add data/site/pncp data/site/mudancas docs/feeds
              git diff --staged --quiet || git commit -m "pncp: summaries rebuilt with the code now on main"
            fi
          done
          exit 1
