name: ref

# Rebuilds the crosswalk that links one politician across sources, the
# views that join the sources through it, and the deputies' and senators'
# profile pages built on them, after the Saturday jobs have refreshed the
# Câmara, Senado and TSE data.
on:
  schedule:
    - cron: "17 12 * * 0"   # Sundays, 12:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ref
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q tests/ref tests/views tests/site/test_deputados.py tests/site/test_senadores.py

      - name: Download and rebuild
        run: |
          uv run python -m politicaleye ref update
          uv run python -m politicaleye ref prefeitos
          uv run python -m politicaleye views update
          uv run python -m politicaleye site build deputados senadores

      - name: Commit if the data changed
        run: |
          git add data/ref data/views data/site/deputados data/site/senadores
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ref: update through $(date -u +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs   # on a clash in a generated summary, this run's (newer) build wins
          done
          exit 1
