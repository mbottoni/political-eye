name: site

# Rebuilds every page's summaries (data/site/) when the code that makes them
# changes on main. The source jobs rebuild only their own pages on their own
# schedule, so without this a builder fix waits for the next run of each source
# (and a run that started before the fix commits summaries made by the old code).
on:
  push:
    branches: [main]
    paths:
      - "politicaleye/**"
      - "!politicaleye/*/fetch.py"
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to rebuild, space-separated (empty: all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Rebuild the summaries
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          if [[ -n "$PAGES" && ! "$PAGES" =~ ^[a-z\ ]+$ ]]; then
            echo "pages must be page names, got: $PAGES" >&2
            exit 1
          fi
          uv run python -m politicaleye site build $PAGES

      - name: Commit if a summary changed
        run: |
          git add data/site
          if git diff --staged --quiet; then
            echo "No summary changed."
            exit 0
          fi
          pages=$(git diff --staged --name-only | cut -d/ -f3 | sort -u | tr '\n' ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "site: summaries rebuilt with the code now on main" -m "Pages: ${pages}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
