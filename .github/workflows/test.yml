name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      # Each explorer page (docs/<source>/) recomputes its numbers in
      # JavaScript; it must agree with the Python package on every month.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Explorer parity with the Python package (camara)
        run: node tests/camara/parity.mjs

      # The committed data must load and produce graphs with the current code.
      # (Latest month with votes: January and July recesses have none.)
      - name: Smoke-test the latest Câmara voting month
        run: |
          uv run python - <<'EOF'
          import pandas as pd
          from politicaleye import camara
          idx = pd.read_csv("data/camara/index.csv")
          m = idx[idx.covote_nodes > 0].month.iloc[-1]
          gv, gc = camara.aligned(m)
          print(m, gv.number_of_nodes(), gv.number_of_edges(), gc.number_of_edges())
          assert gv.number_of_nodes() > 0
          EOF

      - name: Smoke-test the latest Senado window
        run: |
          uv run python - <<'EOF'
          import pandas as pd
          from politicaleye import senado
          idx = pd.read_csv("data/senado/index.csv")
          m = idx[idx.covote_nodes > 0].month.iloc[-1]
          gv, gc = senado.aligned(m)
          print(m, gv.number_of_nodes(), gv.number_of_edges(), gc.number_of_edges())
          assert gv.number_of_nodes() > 0
          EOF
