[project]
name = "political-eye"
version = "0.1.0"
description = "Brazilian politics and public money from official open data, committed as it changes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maruan Ottoni" }]
keywords = ["brazil", "congress", "transparency", "public-spending", "elections", "roll-call", "networks", "graphs", "dataset", "git-scraping"]
dependencies = ["numpy>=1.26", "pandas>=2.1", "networkx>=3.2"]

[project.urls]
Homepage = "https://github.com/mbottoni/political-eye"

[project.scripts]
politicaleye = "politicaleye.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["politicaleye"]
